# Beispiel (#1358): im Pull Request prüfen, ob die geänderten Zeilen den
# Formatregeln des Projekts entsprechen (format.* in atlas.json, .editorconfig).
# Der Diff steht im Protokoll des Schritts und als Artefakt zum Herunterladen.
# Läuft auf einem Windows-Runner, auf dem AtlasServer.exe liegt (siehe Release, #83).
name: Atlas-Formatierung

on:
  pull_request:

jobs:
  formatierung:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Für die Merge-Base braucht git die Historie beider Branches.
          fetch-depth: 0
      - name: Formatierung der geänderten Zeilen prüfen
        shell: pwsh
        run: |
          .\AtlasServer.exe --check . --format-check --changed origin/${{ github.base_ref }} --changed-lines `
            --format diff --output formatierung.diff
          $Code = $LASTEXITCODE
          Get-Content formatierung.diff
          exit $Code
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: formatierung
          path: formatierung.diff
