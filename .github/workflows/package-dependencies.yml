name: Package-Abhängigkeiten

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Rollenmatrix: Selbsttest"
        shell: pwsh
        run: ./Tools/Check-PackageDependencies.ps1 -SelfTest
      - name: Package-Abhängigkeiten prüfen
        shell: pwsh
        run: ./Tools/Check-PackageDependencies.ps1
      - name: "Modulgrenzen: Selbsttest mit absichtlichen Verstößen (#1455)"
        shell: pwsh
        run: ./Tools/Test-PackageDependencies.ps1
      - name: Keine Ausgaben auf stdout
        shell: pwsh
        run: ./Tools/Check-ConsoleOutput.ps1
      - name: Keine Embarcadero-Quellen in Tests (#77)
        shell: pwsh
        run: ./Tools/Check-NoEmbarcaderoSources.ps1
      - name: Mit Delphi 12 verträglich
        shell: pwsh
        run: ./Tools/Check-Delphi12.ps1
      - name: Einreihen in den Hauptthread nur über TAtlasMainThread
        shell: pwsh
        run: ./Tools/Check-MainThreadQueue.ps1
      - name: Projektdateien für MSBuild lesbar, Selbsttest
        shell: pwsh
        run: ./Tools/Check-ProjectFiles.ps1 -SelfTest
      - name: Projektdateien für MSBuild lesbar (Quelltext-Bau Delphi 12)
        shell: pwsh
        run: ./Tools/Check-ProjectFiles.ps1
      - name: Fenster und Editorleisten über die gemeinsamen Hüllen (#1248)
        shell: pwsh
        run: ./Tools/Check-WindowHosts.ps1
      - name: Sprungziele der F1-Hilfe vorhanden (#1886)
        shell: pwsh
        run: ./Tools/Check-HelpAnchors.ps1
      - name: Keine doppelten XML-Doku-Kommentare
        shell: pwsh
        run: ./Tools/Check-DocComments.ps1
      - name: Deutsche Literale nur in Texttabellen (#1458), Selbsttest
        shell: pwsh
        run: ./Tools/Check-GermanText.ps1 -SelfTest
      - name: Deutsche Literale nur in Texttabellen (#1458)
        shell: pwsh
        run: ./Tools/Check-GermanText.ps1
      - name: Jede Unit mit Logik hat Tests, jede Testunit läuft (#415)
        shell: pwsh
        run: ./Tools/Check-TestCoverage.ps1
      - name: Regelkatalog aktuell und vollständig
        shell: pwsh
        run: ./Tools/Update-RuleCatalog.ps1 -Check
      - name: Konfigurationsdoku aktuell
        shell: pwsh
        run: ./Tools/Update-ConfigDoc.ps1 -Check
      - name: Vorlage der Architekturkarte eingebettet (#1118)
        shell: pwsh
        run: ./Tools/Update-ArchitectureMap.ps1 -Check
      - name: Wächter für experimentelle Funktionen (#834)
        shell: pwsh
        run: ./Tools/Test-Experimental.ps1
      - name: Markierungen für „Neu in Atlas“ lesbar (#756)
        shell: pwsh
        run: ./Tools/Update-WhatsNew.ps1 -Unreleased 0.0.0 -OutFile "$env:RUNNER_TEMP/whatsnew.json"
      - name: Tipps für „Atlas entdecken“ vollständig (#757)
        shell: pwsh
        run: ./Tools/Check-Tips.ps1
      - name: Lokale HTML-Doku erzeugbar (#766)
        shell: pwsh
        run: ./Tools/Build-Docs.ps1 -OutDir "$env:RUNNER_TEMP/Doku"
      - name: Benchmark-Hilfsfunktionen testen
        run: node --test Tools/Benchmark/lib.test.mjs Tools/Benchmark/ready-lib.test.mjs
      - name: Release-Paket und Versionsdatei (#1519), Selbsttest
        shell: pwsh
        run: ./Tools/Test-ReleasePackage.ps1
      - name: Versionen von Server und Claude-Code-Plugin gleich
        shell: pwsh
        run: ./Tools/Check-Version.ps1
      - name: Release-Notizen der aktuellen Version passen in ein GitHub Release
        shell: pwsh
        run: |
          $unit = Get-Content -Raw Packages/Atlas.Text/Source/Product/Atlas.Text.Product.Version.pas
          ./Tools/Get-ReleaseNotes.ps1 -Version ([regex]::Match($unit, "Version\s*=\s*'([^']+)'").Groups[1].Value) | Out-Null
      - name: Keine Embarcadero-Quellen in Tests (#77)
        shell: pwsh
        run: ./Tools/Check-NoEmbarcaderoSources.ps1
      - name: Drittanbieter-Hinweise aktuell (#77)
        shell: pwsh
        run: ./Tools/Update-ThirdPartyNotices.ps1 -Check
