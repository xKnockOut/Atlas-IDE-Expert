name: Package-Abhängigkeiten

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package-Abhängigkeiten prüfen
        shell: pwsh
        run: ./Tools/Check-PackageDependencies.ps1
      - name: Keine Ausgaben auf stdout
        shell: pwsh
        run: ./Tools/Check-ConsoleOutput.ps1
      - name: Keine Embarcadero-Quellen in Tests (#77)
        shell: pwsh
        run: ./Tools/Check-NoEmbarcaderoSources.ps1
      - name: Mit Delphi 12 verträglich
        shell: pwsh
        run: ./Tools/Check-Delphi12.ps1
      - name: Regelkatalog aktuell und vollständig
        shell: pwsh
        run: ./Tools/Update-RuleCatalog.ps1 -Check
      - name: Konfigurationsdoku aktuell
        shell: pwsh
        run: ./Tools/Update-ConfigDoc.ps1 -Check
      - name: Benchmark-Hilfsfunktionen testen
        run: node --test Tools/Benchmark/lib.test.mjs
      - name: Versionen von Server und Erweiterung gleich
        shell: pwsh
        run: ./Tools/Check-Version.ps1
