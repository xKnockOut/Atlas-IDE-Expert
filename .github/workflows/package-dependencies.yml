name: Package-Abhängigkeiten

# Pflichtprüfung für main-merging ist der Job check (docs/Zusammenfuehren.md). Er sammelt nur die Ergebnisse der Jobs
# pruefungen (alle Check-Skripte nacheinander, etwa acht Minuten) und modulgrenzen (Selbsttest der Modulgrenzen, auf
# mehrere Jobs verteilt), die gleichzeitig laufen. So bleibt der Name der Pflichtprüfung gleich, und der langsamste
# Teil bestimmt die Dauer statt der Summe.

on:
  push:
    # main-merging: nach jedem Merge den zusammengeführten Stand prüfen (docs/Zusammenfuehren.md).
    branches: [main, main-merging, 'release/**']
  pull_request:
  # Merge Queue (nur in Repositorys einer Organisation): prüft den Stand aller PRs davor wie nach einem Merge.
  merge_group:
  # Nach einem Push des automatischen Abgleichs mit GITHUB_TOKEN (pr-abgleich.yml) startet die Prüfung so; der Lauf
  # prüft den Branch gegen seine Basis mit main-merging wie ein Pull Request.
  workflow_dispatch:

concurrency:
  # Je Branch ein Lauf und höchstens ein wartender (der neueste). Nach mehreren Merges kurz hintereinander auf
  # main-merging prüft so nur der letzte Stand, statt dass jeder Merge einen vollen Lauf belegt.
  group: package-dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release-Tags für Check-ContractVersion.ps1
          fetch-depth: 0
      - name: Vergleichsstand
        id: stand
        env:
          MERGE_GROUP_BASIS: ${{ github.event.merge_group.base_sha }}
        run: |
          # Pull Request: Merge-Commit, erster Elter ist das Ziel. Merge Queue: Stand des Ziels vor der Gruppe.
          # workflow_dispatch: Basis mit main-merging.
          basis=''
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            basis=$(git rev-parse HEAD^1)
          elif [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            basis="$MERGE_GROUP_BASIS"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            basis=$(git merge-base HEAD origin/main-merging)
          fi
          echo "basis=$basis" >> "$GITHUB_OUTPUT"
      - name: Merge-Helfer, Selbsttest
        run: python3 Tools/Merge-Integration.py --selbsttest
      - name: Units umbenennen, Selbsttest
        run: python3 Tools/Rename-Units.py --selbsttest
      - name: Konstante Arrays passen zu ihrer Aufzählung (Delphi E2072, FPC übersetzt VCL-Units nicht), Selbsttest
        run: python3 Tools/Check-ConstArrays.py --selbsttest
      - name: Konstante Arrays passen zu ihrer Aufzählung
        run: python3 Tools/Check-ConstArrays.py
      - name: Changelog-Fragmente lesbar, keine neuen Einträge direkt in CHANGELOG.md
        shell: pwsh
        env:
          BASIS: ${{ steps.stand.outputs.basis }}
        run: |
          if ($env:BASIS) { ./Tools/Update-Changelog.ps1 -Check -Base $env:BASIS }
          else { ./Tools/Update-Changelog.ps1 -Check }
      - name: Vertragsversion von Base höchstens einmal je Release
        shell: pwsh
        env:
          BASIS: ${{ steps.stand.outputs.basis }}
        run: |
          if ($env:BASIS) { ./Tools/Check-ContractVersion.ps1 -Base $env:BASIS }
          else { ./Tools/Check-ContractVersion.ps1 }
      - name: "Rollenmatrix: Selbsttest"
        shell: pwsh
        run: ./Tools/Check-PackageDependencies.ps1 -SelfTest
      - name: Package-Abhängigkeiten prüfen
        shell: pwsh
        run: ./Tools/Check-PackageDependencies.ps1
      - name: "Feature-Zyklen: Selbsttest"
        shell: pwsh
        run: ./Tools/Check-FeatureCycles.ps1 -SelfTest
      - name: Keine Zyklen zwischen Features, Richtungen eingehalten
        shell: pwsh
        run: ./Tools/Check-FeatureCycles.ps1
      - name: "Baselines: Selbsttest des Vergleichs je Kopie und der größeren Klassen"
        shell: pwsh
        run: ./Tools/Check-Baselines.ps1 -SelfTest
      - name: "Kandidaten: Selbsttest der Regel vor einer stabilen Version"
        shell: pwsh
        run: ./Tools/Check-ReleaseCandidate.ps1 -SelfTest
      - name: "Kandidaten: Selbsttest der Liste zum Abhaken"
        shell: pwsh
        run: ./Tools/New-CandidateChecklist.ps1 -SelfTest
      - name: atlas.json der Plugin-Packages aus Packages/atlas.plugin.json
        shell: pwsh
        run: ./Tools/Update-PackageConfigs.ps1 -Check
      - name: Baselines ohne tote Einträge, keine Regel und keine Kopie wächst
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          BASIS: ${{ steps.stand.outputs.basis }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
        run: |
          # Neue oder gewachsene Gruppen in atlas-duplicates.json lässt nur eine Zeile „Neue Kopien: …“ im
          # Pull Request durch, neue Einträge zu metric-class-size nur je Klasse eine Zeile
          # „Größere Klasse: <Name> – <Grund>“. Der Text wird hier gelesen, nicht aus dem Ereignis: Nach dem
          # Ergänzen der Beschreibung genügt es, den Lauf neu zu starten. Ohne Pull Request im Ereignis (Push nach dem
          # Merge, Abgleich) gilt der Pull Request, zu dem der geprüfte Commit gehört.
          $text = ''
          if ($env:PR_NUMMER) {
            $text = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMMER" --jq '.body // ""'
          } else {
            $text = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" --jq '.[0].body // ""' 2>$null
          }
          $grund = ''
          $klassen = @()
          foreach ($zeile in @($text -split '\r?\n')) {
            if (-not $grund -and $zeile -match '^\s*Neue Kopien:\s*(\S.*)$') { $grund = $Matches[1].Trim() }
            if ($zeile -match '^\s*Größere Klasse:\s*(\S.*)$') { $klassen += $Matches[1].Trim() }
          }
          # Pull Request vergleicht gegen HEAD^1 (Stand des Ziels im Merge-Commit), workflow_dispatch gegen die Basis.
          if ($env:BASIS) {
            $ref = $env:BASIS
          } elseif ($env:BASE_REF) {
            git fetch --no-tags --depth=1 origin "+refs/heads/$($env:BASE_REF):refs/remotes/origin/$($env:BASE_REF)"
            $ref = "origin/$($env:BASE_REF)"
          } elseif ($env:BEFORE -and $env:BEFORE -notmatch '^0+$') {
            git fetch --no-tags --depth=1 origin $env:BEFORE
            $ref = $env:BEFORE
          } else {
            Write-Host 'Kein Vergleichsstand (erster Push des Branches); nur tote Einträge prüfen.'
            $ref = 'HEAD'
          }
          ./Tools/Check-Baselines.ps1 -BaseRef $ref -DuplicatesReason $grund -LargerClasses $klassen
      - name: Keine Ausgaben auf stdout
        shell: pwsh
        run: ./Tools/Check-ConsoleOutput.ps1
      - name: Keine Embarcadero-Quellen in Tests (#77)
        shell: pwsh
        run: ./Tools/Check-NoEmbarcaderoSources.ps1
      - name: Mit Delphi 12 verträglich
        shell: pwsh
        run: ./Tools/Check-Delphi12.ps1
      - name: Einreihen in den Hauptthread nur über TAtlasMainThread
        shell: pwsh
        run: ./Tools/Check-MainThreadQueue.ps1
      - name: Projektdateien für MSBuild lesbar, Selbsttest
        shell: pwsh
        run: ./Tools/Check-ProjectFiles.ps1 -SelfTest
      - name: Projektdateien für MSBuild lesbar (Quelltext-Bau Delphi 12)
        shell: pwsh
        run: ./Tools/Check-ProjectFiles.ps1
      - name: Bereichs- und Überlaufprüfung im Debug-Build, Selbsttest
        shell: pwsh
        run: ./Tools/Check-RuntimeChecks.ps1 -SelfTest
      - name: Bereichs- und Überlaufprüfung im Debug-Build
        shell: pwsh
        run: ./Tools/Check-RuntimeChecks.ps1
      - name: Aufwärm-Routinen der Tests nur weniger, keine vorgewärmten Sperren, Selbsttest
        shell: pwsh
        run: ./Tools/Check-TestWarmUps.ps1 -SelfTest
      - name: Aufwärm-Routinen der Tests nur weniger, keine vorgewärmten Sperren
        shell: pwsh
        run: ./Tools/Check-TestWarmUps.ps1
      - name: Fenster und Editorleisten über die gemeinsamen Hüllen (#1248)
        shell: pwsh
        run: ./Tools/Check-WindowHosts.ps1
      - name: Jeder Dialog wird in einem Test gebaut, Selbsttest
        shell: pwsh
        run: ./Tools/Check-DialogTests.ps1 -SelfTest
      - name: Jeder Dialog wird in einem Test gebaut
        shell: pwsh
        run: ./Tools/Check-DialogTests.ps1
      - name: Sprungziele der F1-Hilfe vorhanden (#1886)
        shell: pwsh
        run: ./Tools/Check-HelpAnchors.ps1
      - name: Keine doppelten XML-Doku-Kommentare und keine Review-Kennungen, Selbsttest
        shell: pwsh
        run: ./Tools/Check-DocComments.ps1 -SelfTest
      - name: Keine doppelten XML-Doku-Kommentare und keine Review-Kennungen
        shell: pwsh
        run: ./Tools/Check-DocComments.ps1
      - name: Deutsche Literale nur in Texttabellen (#1458), Selbsttest
        shell: pwsh
        run: ./Tools/Check-GermanText.ps1 -SelfTest
      - name: Deutsche Literale nur in Texttabellen (#1458)
        shell: pwsh
        run: ./Tools/Check-GermanText.ps1
      - name: Jede Unit mit Logik hat Tests, jede Testunit läuft (#415)
        shell: pwsh
        run: ./Tools/Check-TestCoverage.ps1
      - name: Regelkatalog aktuell und vollständig
        shell: pwsh
        run: ./Tools/Update-RuleCatalog.ps1 -Check
      - name: Konfigurationsdoku aktuell
        shell: pwsh
        run: ./Tools/Update-ConfigDoc.ps1 -Check
      - name: Vorlage der Architekturkarte eingebettet (#1118)
        shell: pwsh
        run: ./Tools/Update-ArchitectureMap.ps1 -Check
      - name: Wächter für experimentelle Funktionen (#834)
        shell: pwsh
        run: ./Tools/Test-Experimental.ps1
      - name: Markierungen für „Neu in Atlas“ lesbar (#756)
        shell: pwsh
        run: ./Tools/Update-WhatsNew.ps1 -Unreleased 0.0.0 -OutFile "$env:RUNNER_TEMP/whatsnew.json"
      - name: Tipps für „Atlas entdecken“ vollständig (#757)
        shell: pwsh
        run: ./Tools/Check-Tips.ps1
      - name: Lokale HTML-Doku erzeugbar (#766)
        shell: pwsh
        run: ./Tools/Build-Docs.ps1 -OutDir "$env:RUNNER_TEMP/Doku"
      - name: Benchmark-Hilfsfunktionen testen
        run: node --test Tools/Benchmark/lib.test.mjs Tools/Benchmark/ready-lib.test.mjs
      - name: Release-Paket und Versionsdatei (#1519), Selbsttest
        shell: pwsh
        run: ./Tools/Test-ReleasePackage.ps1
      - name: Signatur der Versionsdatei (#1519), Selbsttest
        shell: pwsh
        run: ./Tools/Test-VersionFileSignature.ps1
      - name: Versionen von Server und Claude-Code-Plugin gleich
        shell: pwsh
        run: ./Tools/Check-Version.ps1
      - name: Release-Notizen der aktuellen Version passen in ein GitHub Release
        shell: pwsh
        run: |
          $unit = Get-Content -Raw Packages/Atlas.Text/Source/Product/Atlas.Text.Product.Version.pas
          ./Tools/Get-ReleaseNotes.ps1 -Version ([regex]::Match($unit, "Version\s*=\s*'([^']+)'").Groups[1].Value) | Out-Null
      - name: Keine Embarcadero-Quellen in Tests (#77)
        shell: pwsh
        run: ./Tools/Check-NoEmbarcaderoSources.ps1
      - name: Drittanbieter-Hinweise aktuell (#77)
        shell: pwsh
        run: ./Tools/Update-ThirdPartyNotices.ps1 -Check

  # Selbsttest der Modulgrenzen (#1455): jeder Fall ruft die Prüfung über eine Kopie des Repositorys auf (etwa zwei
  # Minuten), nacheinander zusammen über 40 Minuten. Die Fälle laufen deshalb verteilt auf mehrere Jobs.
  # Im Pull Request nur, wenn sich die Prüfung selbst, Verträge oder Units, auf die sich seine Fälle stützen, ändern
  # (gelöscht/verschoben); nach jedem Merge auf main-merging und in der Merge Queue immer.
  modulgrenzen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Nötig?
        id: noetig
        run: |
          grenzen=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            basis=$(git rev-parse HEAD^1)
            if ! git diff --name-only "$basis" HEAD | grep -qE \
                '^(Tools/(Check|Test)-PackageDependencies\.ps1|\.github/workflows/package-dependencies\.yml|Packages/Atlas\.IDE\.Base/Source/Foundation/)' \
              && [ -z "$(git diff --name-only --diff-filter=DR "$basis" HEAD -- Packages)" ]; then
              grenzen=false
              echo 'Keine Änderung, die den Selbsttest betrifft; er läuft nach dem Merge auf main-merging.'
            fi
          fi
          echo "grenzen=$grenzen" >> "$GITHUB_OUTPUT"
      - name: "Modulgrenzen: Selbsttest mit absichtlichen Verstößen (#1455), Teil ${{ matrix.teil }}"
        if: steps.noetig.outputs.grenzen == 'true'
        shell: pwsh
        run: ./Tools/Test-PackageDependencies.ps1 -Shard ${{ matrix.teil }} -Shards 5

  # Pflichtprüfung: grün nur, wenn pruefungen und alle Teile von modulgrenzen grün sind.
  check:
    needs: [pruefungen, modulgrenzen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnisse
        env:
          PRUEFUNGEN: ${{ needs.pruefungen.result }}
          MODULGRENZEN: ${{ needs.modulgrenzen.result }}
        run: |
          echo "pruefungen: $PRUEFUNGEN, modulgrenzen: $MODULGRENZEN"
          [ "$PRUEFUNGEN" = success ] && [ "$MODULGRENZEN" = success ]

  # Rot auf main-merging sofort sichtbar machen: Issue „main-merging rot“ und Kommentar am verursachenden Pull Request.
  melden:
    needs: check
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main-merging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Tools/CI
      - name: Stand von main-merging melden
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/CI/Melde-Integrationsstand.py --workflow "${{ github.workflow }}" --ergebnis "${{ needs.check.result }}"
