name: Package-Abhängigkeiten

on:
  push:
    # main-merging: nach jedem Merge den zusammengeführten Stand prüfen (docs/Zusammenfuehren.md).
    branches: [main, main-merging, 'release/**']
  pull_request:
  # Nach einem Push des automatischen Abgleichs mit GITHUB_TOKEN (pr-abgleich.yml) startet die Prüfung so; der Lauf
  # prüft den Branch gegen seine Basis mit main-merging wie ein Pull Request.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release-Tags für Check-ContractVersion.ps1
          fetch-depth: 0
      - name: Vergleichsstand und geänderte Dateien
        id: stand
        run: |
          # Pull Request: Merge-Commit, erster Elter ist das Ziel. workflow_dispatch: Basis mit main-merging.
          basis=''
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            basis=$(git rev-parse HEAD^1)
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            basis=$(git merge-base HEAD origin/main-merging)
          fi
          echo "basis=$basis" >> "$GITHUB_OUTPUT"
          # Der Selbsttest der Modulgrenzen dauert etwa sechs Minuten. Im Pull Request läuft er nur, wenn sich die
          # Prüfung selbst, Verträge oder Units, auf die sich seine Fälle stützen, ändern (gelöscht/verschoben);
          # nach jedem Merge auf main-merging läuft er immer.
          grenzen=true
          if [ -n "$basis" ] && ! git diff --name-only "$basis" HEAD | grep -qE \
              '^(Tools/(Check|Test)-PackageDependencies\.ps1|\.github/workflows/package-dependencies\.yml|Packages/Atlas\.IDE\.Base/Source/Contracts/)' \
            && [ -z "$(git diff --name-only --diff-filter=DR "$basis" HEAD -- Packages)" ]; then
            grenzen=false
          fi
          echo "grenzen=$grenzen" >> "$GITHUB_OUTPUT"
      - name: Merge-Helfer, Selbsttest
        run: python3 Tools/Merge-Integration.py --selbsttest
      - name: Changelog-Fragmente lesbar, keine neuen Einträge direkt in CHANGELOG.md
        shell: pwsh
        env:
          BASIS: ${{ steps.stand.outputs.basis }}
        run: |
          if ($env:BASIS) { ./Tools/Update-Changelog.ps1 -Check -Base $env:BASIS }
          else { ./Tools/Update-Changelog.ps1 -Check }
      - name: Vertragsversion von Base höchstens einmal je Release
        shell: pwsh
        env:
          BASIS: ${{ steps.stand.outputs.basis }}
        run: |
          if ($env:BASIS) { ./Tools/Check-ContractVersion.ps1 -Base $env:BASIS }
          else { ./Tools/Check-ContractVersion.ps1 }
      - name: "Rollenmatrix: Selbsttest"
        shell: pwsh
        run: ./Tools/Check-PackageDependencies.ps1 -SelfTest
      - name: Package-Abhängigkeiten prüfen
        shell: pwsh
        run: ./Tools/Check-PackageDependencies.ps1
      - name: atlas.json der Plugin-Packages aus Packages/atlas.plugin.json (Code-Review A-101)
        shell: pwsh
        run: ./Tools/Update-PackageConfigs.ps1 -Check
      - name: Baselines ohne tote Einträge, keine Regel wächst (Code-Review A-101)
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          BASIS: ${{ steps.stand.outputs.basis }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:BASIS) {
            $ref = $env:BASIS
          } elseif ($env:BASE_REF) {
            git fetch --no-tags --depth=1 origin "+refs/heads/$($env:BASE_REF):refs/remotes/origin/$($env:BASE_REF)"
            $ref = "origin/$($env:BASE_REF)"
          } elseif ($env:BEFORE -and $env:BEFORE -notmatch '^0+$') {
            git fetch --no-tags --depth=1 origin $env:BEFORE
            $ref = $env:BEFORE
          } else {
            Write-Host 'Kein Vergleichsstand (erster Push des Branches); nur tote Einträge prüfen.'
            $ref = 'HEAD'
          }
          ./Tools/Check-Baselines.ps1 -BaseRef $ref
      - name: "Modulgrenzen: Selbsttest mit absichtlichen Verstößen (#1455)"
        if: steps.stand.outputs.grenzen == 'true'
        shell: pwsh
        run: ./Tools/Test-PackageDependencies.ps1
      - name: Keine Ausgaben auf stdout
        shell: pwsh
        run: ./Tools/Check-ConsoleOutput.ps1
      - name: Keine Embarcadero-Quellen in Tests (#77)
        shell: pwsh
        run: ./Tools/Check-NoEmbarcaderoSources.ps1
      - name: Mit Delphi 12 verträglich
        shell: pwsh
        run: ./Tools/Check-Delphi12.ps1
      - name: Einreihen in den Hauptthread nur über TAtlasMainThread
        shell: pwsh
        run: ./Tools/Check-MainThreadQueue.ps1
      - name: Projektdateien für MSBuild lesbar, Selbsttest
        shell: pwsh
        run: ./Tools/Check-ProjectFiles.ps1 -SelfTest
      - name: Projektdateien für MSBuild lesbar (Quelltext-Bau Delphi 12)
        shell: pwsh
        run: ./Tools/Check-ProjectFiles.ps1
      - name: Fenster und Editorleisten über die gemeinsamen Hüllen (#1248)
        shell: pwsh
        run: ./Tools/Check-WindowHosts.ps1
      - name: Sprungziele der F1-Hilfe vorhanden (#1886)
        shell: pwsh
        run: ./Tools/Check-HelpAnchors.ps1
      - name: Keine doppelten XML-Doku-Kommentare
        shell: pwsh
        run: ./Tools/Check-DocComments.ps1
      - name: Deutsche Literale nur in Texttabellen (#1458), Selbsttest
        shell: pwsh
        run: ./Tools/Check-GermanText.ps1 -SelfTest
      - name: Deutsche Literale nur in Texttabellen (#1458)
        shell: pwsh
        run: ./Tools/Check-GermanText.ps1
      - name: Jede Unit mit Logik hat Tests, jede Testunit läuft (#415)
        shell: pwsh
        run: ./Tools/Check-TestCoverage.ps1
      - name: Regelkatalog aktuell und vollständig
        shell: pwsh
        run: ./Tools/Update-RuleCatalog.ps1 -Check
      - name: Konfigurationsdoku aktuell
        shell: pwsh
        run: ./Tools/Update-ConfigDoc.ps1 -Check
      - name: Vorlage der Architekturkarte eingebettet (#1118)
        shell: pwsh
        run: ./Tools/Update-ArchitectureMap.ps1 -Check
      - name: Wächter für experimentelle Funktionen (#834)
        shell: pwsh
        run: ./Tools/Test-Experimental.ps1
      - name: Markierungen für „Neu in Atlas“ lesbar (#756)
        shell: pwsh
        run: ./Tools/Update-WhatsNew.ps1 -Unreleased 0.0.0 -OutFile "$env:RUNNER_TEMP/whatsnew.json"
      - name: Tipps für „Atlas entdecken“ vollständig (#757)
        shell: pwsh
        run: ./Tools/Check-Tips.ps1
      - name: Lokale HTML-Doku erzeugbar (#766)
        shell: pwsh
        run: ./Tools/Build-Docs.ps1 -OutDir "$env:RUNNER_TEMP/Doku"
      - name: Benchmark-Hilfsfunktionen testen
        run: node --test Tools/Benchmark/lib.test.mjs Tools/Benchmark/ready-lib.test.mjs
      - name: Release-Paket und Versionsdatei (#1519), Selbsttest
        shell: pwsh
        run: ./Tools/Test-ReleasePackage.ps1
      - name: Versionen von Server und Claude-Code-Plugin gleich
        shell: pwsh
        run: ./Tools/Check-Version.ps1
      - name: Release-Notizen der aktuellen Version passen in ein GitHub Release
        shell: pwsh
        run: |
          $unit = Get-Content -Raw Packages/Atlas.Text/Source/Product/Atlas.Text.Product.Version.pas
          ./Tools/Get-ReleaseNotes.ps1 -Version ([regex]::Match($unit, "Version\s*=\s*'([^']+)'").Groups[1].Value) | Out-Null
      - name: Keine Embarcadero-Quellen in Tests (#77)
        shell: pwsh
        run: ./Tools/Check-NoEmbarcaderoSources.ps1
      - name: Drittanbieter-Hinweise aktuell (#77)
        shell: pwsh
        run: ./Tools/Update-ThirdPartyNotices.ps1 -Check

  # Rot auf main-merging sofort sichtbar machen: Issue „main-merging rot“ und Kommentar am verursachenden Pull Request.
  melden:
    needs: check
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main-merging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Tools/CI
      - name: Stand von main-merging melden
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/CI/Melde-Integrationsstand.py --workflow "${{ github.workflow }}" --ergebnis "${{ needs.check.result }}"
