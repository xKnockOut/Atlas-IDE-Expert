name: Server und Tests

# Delphi darf aus Lizenzgründen nicht auf gehosteten Runnern laufen. RAD Studio
# Starter hat zudem kein msbuild/dcc auf der Kommandozeile; gebaut wird über das
# IDE-Plugin cc.ps1 (siehe docs/Uebergabe.md). Der Job braucht deshalb einen
# selbst gehosteten Windows-Runner mit den Labels [self-hosted, windows, delphi]
# auf einem Rechner mit RAD Studio und cc.ps1, im angemeldeten Benutzerkontext
# (nicht als Dienst), weil cc.ps1 eine IDE startet.
# Der Job läuft nur, wenn die Repository-Variable DELPHI_RUNNER auf 'true'
# steht; sonst meldet der Job "uebersprungen" das sichtbar in der
# Zusammenfassung. CC_SCRIPT überschreibt den Pfad zu cc.ps1. Siehe ADR 0007.
#
# Neue Pushes auf denselben Branch brechen einen laufenden Build ab: Jeder Lauf
# startet eine Scratch-IDE, und bei vielen gestapelten Branches wartete die
# Schlange sonst stundenlang.

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uebersprungen:
    if: vars.DELPHI_RUNNER != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Server-Job übersprungen
        run: |
          echo "::notice title=Server-Job übersprungen::Kein Delphi-Runner eingerichtet (Repository-Variable DELPHI_RUNNER ist nicht 'true'); Build und Tests sind nicht gelaufen."
          {
            echo "### Server-Job übersprungen"
            echo
            echo "Build, Plugin-BPL und DUnitX-Tests laufen nur auf dem selbst gehosteten Delphi-Runner."
            echo "Die Repository-Variable \`DELPHI_RUNNER\` steht nicht auf \`true\`; dieser Lauf hat nichts davon geprüft."
          } >> "$GITHUB_STEP_SUMMARY"

  build-test:
    if: vars.DELPHI_RUNNER == 'true'
    runs-on: [self-hosted, windows, delphi]
    env:
      CC_SCRIPT: ${{ vars.CC_SCRIPT || 'C:\Projekte\IDE-Plugins\Claude-Compile\cc.ps1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Bauen und testen über cc.ps1 (Tools/Build-Test.ps1, 0/0/0-Regel)
        shell: pwsh
        run: ./Tools/Build-Test.ps1 -CcScript $env:CC_SCRIPT -Win32 -ResultFile dunitx-ergebnisse.xml
      - name: Selbstprüfung des Servers (#152)
        if: always()
        shell: pwsh
        # Bericht, kein Abbruch: Treffer im eigenen Quelltext sollen sichtbar
        # werden, ohne den Lauf rot zu färben.
        continue-on-error: true
        run: ./Output/Win64/Debug/Bin/AtlasServer.exe --root . --check Packages --format sarif --output selbstpruefung.sarif
      - name: Selbstprüfung ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selbstpruefung
          path: selbstpruefung.sarif
          if-no-files-found: ignore
      - name: Testergebnisse als Report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          nunit_files: dunitx-ergebnisse.xml
          check_name: DUnitX-Ergebnisse
      - name: Ergebnisdatei ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunitx-ergebnisse
          path: dunitx-ergebnisse.xml
      # Dateiname je IDE-Version (LIBSUFFIX AUTO), z. B. Atlas.IDE.Expert370.bpl (#281).
      - name: Plugin-BPL ablegen (Win32, klassische IDE)
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ide-expert-win32
          path: Output/Win32/Debug/Bpl/Atlas.IDE.Expert*.bpl
          if-no-files-found: error
      - name: Plugin-BPL ablegen (Win64, 64-Bit-IDE)
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ide-expert-win64
          path: Output/Win64/Debug/Bpl/Atlas.IDE.Expert*.bpl
          if-no-files-found: error
