name: Server und Tests

# Delphi darf aus Lizenzgründen nicht auf gehosteten Runnern laufen. Der Job
# braucht deshalb einen selbst gehosteten Windows-Runner mit den Labels
# [self-hosted, windows, delphi] auf einem Rechner mit RAD Studio, im
# angemeldeten Benutzerkontext (nicht als Dienst), falls das Bau-Skript eine
# IDE startet. Gebaut wird über das Skript in der Umgebungsvariablen
# ATLAS_DELPHI_BUILD des Runners (Parameter und JSON wie Tools/Build-Ide.ps1);
# die Gruppe enthält das Atlas-Plugin, deshalb nicht über Tools/Build-Ide.ps1
# selbst. Ohne die Variable scheitert der Job mit einer klaren Meldung.
# Der Job läuft nur, wenn die Repository-Variable DELPHI_RUNNER auf 'true'
# steht. Sonst meldet "uebersprungen" das ohne grünen Haken: In Pull Requests
# nach main oder release/* scheitert der Job, denn dorthin darf nur, was mit
# Delphi gebaut und getestet ist. In allen anderen Läufen legt er den
# Check-Run "Delphi-Bau und Tests" mit dem Ergebnis neutral an, damit niemand
# den übersprungenen Lauf für einen bestandenen hält. Die plattformunabhängigen
# Tests laufen unabhängig davon unter FPC (linux-server.yml).
#
# Neue Pushes auf denselben Branch brechen einen laufenden Build ab: Jeder Lauf
# kann eine Bau-IDE starten, und bei vielen gestapelten Branches wartete die
# Schlange sonst stundenlang.

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uebersprungen:
    if: vars.DELPHI_RUNNER != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Server-Job übersprungen
        run: |
          echo "::notice title=Server-Job übersprungen::Kein Delphi-Runner eingerichtet (Repository-Variable DELPHI_RUNNER ist nicht 'true'); Build und Tests sind nicht gelaufen."
          {
            echo "### Server-Job übersprungen"
            echo
            echo "Build, Plugin-BPL und DUnitX-Tests laufen nur auf dem selbst gehosteten Delphi-Runner."
            echo "Die Repository-Variable \`DELPHI_RUNNER\` steht nicht auf \`true\`; dieser Lauf hat nichts davon geprüft."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ziel main oder release/* braucht den Delphi-Lauf
        if: github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'release/'))
        run: |
          echo "::error title=Delphi-Lauf fehlt::Pull Requests nach ${{ github.base_ref }} brauchen Bau und Tests auf dem Delphi-Runner."
          exit 1
      - name: Ergebnis neutral melden
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Delphi-Bau und Tests',
              head_sha: sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Nicht gelaufen: kein Delphi-Runner',
                summary: 'Build, Plugin-BPL und DUnitX-Tests unter Delphi sind nicht gelaufen. ' +
                  'Die plattformunabhängigen Tests prüft linux-server.yml unter FPC.'
              }
            });

  build-test:
    if: vars.DELPHI_RUNNER == 'true'
    runs-on: [self-hosted, windows, delphi]
    steps:
      - uses: actions/checkout@v4
      - name: Delphi-Bau-Skript prüfen
        shell: pwsh
        run: |
          if (-not $env:ATLAS_DELPHI_BUILD -or -not (Test-Path $env:ATLAS_DELPHI_BUILD)) {
            throw ('Der Delphi-Runner hat kein Bau-Skript: Umgebungsvariable ATLAS_DELPHI_BUILD auf ein Skript mit ' +
              'den Parametern von Tools/Build-Ide.ps1 (-Project, -Platform, -Mode, -Json) setzen.')
          }
      - name: Bauen und testen (Tools/Build-Test.ps1 über ATLAS_DELPHI_BUILD, 0/0/0-Regel)
        shell: pwsh
        run: ./Tools/Build-Test.ps1 -BuildScript $env:ATLAS_DELPHI_BUILD -Win32 -ResultFile dunitx-ergebnisse.xml
      - name: Selbstprüfung des Servers (#152)
        if: always()
        shell: pwsh
        # Bericht, kein Abbruch: Treffer im eigenen Quelltext sollen sichtbar
        # werden, ohne den Lauf rot zu färben.
        continue-on-error: true
        run: ./Output/Win64/Debug/Bin/AtlasServer.exe --root . --check Packages --format sarif --output selbstpruefung.sarif
      - name: Selbstprüfung ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selbstpruefung
          path: selbstpruefung.sarif
          if-no-files-found: ignore
      - name: Testergebnisse als Report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          nunit_files: dunitx-ergebnisse.xml
          check_name: DUnitX-Ergebnisse
      - name: Ergebnisdatei ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunitx-ergebnisse
          path: dunitx-ergebnisse.xml
      # Dateiname je IDE-Version (LIBSUFFIX AUTO), z. B. Atlas.IDE.Base370.bpl (#281, bis #1456 Atlas.IDE.Expert370.bpl); dazu jedes Modul-Package
      # (Atlas.IDE.Debugger370.bpl …, #1456).
      - name: Plugin-BPL ablegen (Win32, klassische IDE)
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ide-expert-win32
          path: Output/Win32/Debug/Bpl/Atlas.IDE.*.bpl
          if-no-files-found: error
      - name: Plugin-BPL ablegen (Win64, 64-Bit-IDE)
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ide-expert-win64
          path: Output/Win64/Debug/Bpl/Atlas.IDE.*.bpl
          if-no-files-found: error
