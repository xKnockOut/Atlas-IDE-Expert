name: VS-Code-Erweiterung

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Editors/VSCode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Editors/VSCode/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Lint (Typprüfung)
        run: npm run lint
      - name: Übersetzen
        run: npm run compile
      - name: .vsix packen
        run: npx vsce package -o argus.vsix
      - name: .vsix als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: argus-vsix
          path: Editors/VSCode/argus.vsix
