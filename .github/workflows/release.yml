name: Release

# Veröffentlicht eine Version (#83), ausgelöst durch ein Tag v<SemVer>, z. B. v0.2.0.
#
# 1. Prüft, dass Tag, TProductVersion und Claude-Code-Plugin dieselbe Version tragen.
# 2. Baut den Server (Win64 Release) auf dem selbst gehosteten Delphi-Runner,
#    sofern DELPHI_RUNNER = 'true'; signiert ihn, wenn SIGN_CERT_BASE64 und
#    SIGN_CERT_PASSWORD gesetzt sind.
#    Baut außerdem das Plugin (Win32 und Win64) und packt es
#    mit dem Server, whatsnew.json und den Beispielen (#756), tips.json und den
#    Bildern der Tipps (#757), der lokalen HTML-Doku (#766) und den Vorlagen
#    für atlas.json (#759) in atlas-ide-expert-<Version>.zip.
# 3. Packt das Claude-Code-Plugin mit der EXE.
# 4. Legt ein GitHub Release mit EXE, ZIP, Quelltext-ZIP, Plugin, der
#    Versionsdatei atlas-version.json (Update-Prüfung #495, Update-Installer
#    #1519: Paket für Delphi 13 und Quelltext je mit SHA-256) und den
#    Release-Notizen an (docs/Release-Notizen/<Version>.md, sonst der Abschnitt
#    aus CHANGELOG.md).
# 5. Ersetzt die Versionsdatei des Kanals für Vorabversionen
#    (atlas-version-beta.json im festen Vorab-Release „update-channel“, #1519):
#    „latest“ übergeht Vorabversionen, dieser Kanal enthält jede Version.
#    Ohne Delphi-Runner fehlt das Paket; Tools/Publish-ReleasePackage.ps1 hängt
#    danach ein lokal gebautes an und ersetzt beide Versionsdateien.
#    AtlasUpdate.exe gehört ins ZIP; ist sie signiert, verlangt sie für jede
#    EXE, BPL und DLL eines Updates dieselbe gültige Signatur.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionen vergleichen
        id: check
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./Tools/Check-Version.ps1 -Expected $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Release-Notizen prüfen
        shell: pwsh
        # Vor dem Bauen: GitHub lehnt Notizen über 125000 Zeichen ab, das Release scheiterte sonst erst am Ende.
        run: ./Tools/Get-ReleaseNotes.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v')) | Out-Null

  server:
    needs: version
    if: vars.DELPHI_RUNNER == 'true'
    runs-on: [self-hosted, windows, delphi]
    env:
      HAS_SIGNING: ${{ secrets.SIGN_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # Wie server.yml: gebaut wird über das Bau-Skript des Runners (ATLAS_DELPHI_BUILD).
      - name: Delphi-Bau-Skript prüfen
        shell: pwsh
        run: |
          if (-not $env:ATLAS_DELPHI_BUILD -or -not (Test-Path $env:ATLAS_DELPHI_BUILD)) {
            throw ('Der Delphi-Runner hat kein Bau-Skript: Umgebungsvariable ATLAS_DELPHI_BUILD auf ein Skript mit ' +
              'den Parametern von Tools/Build-Ide.ps1 (-Project, -Platform, -Mode, -Json) setzen.')
          }
      - name: Server bauen (Win64 Release)
        shell: pwsh
        run: |
          # Projekt für Projekt: Das Testprojekt der Gruppe wird für das Release nicht gebraucht.
          $start = Get-Date
          # Plugin: zuerst das Kern-Package mit den Verträgen, danach jedes Modul-Package unter Packages\Atlas.IDE.*
          # (#1456), die gegen seine .dcp übersetzen.
          $first = @('Atlas.IDE.Base')
          $plugin = @($first | ForEach-Object { "Packages\$_\$_.dproj" }) + @(Get-ChildItem 'Packages' -Directory -Filter 'Atlas.IDE.*' |
            Where-Object { $_.Name -notin $first -and (Test-Path "$($_.FullName)\$($_.Name).dproj") } |
            Sort-Object Name | ForEach-Object { "Packages\$($_.Name)\$($_.Name).dproj" })
          foreach ($project in @('Packages\Atlas.Text\Atlas.Text.dproj', 'Packages\Atlas.WinBase\Atlas.WinBase.dproj',
            'Packages\Atlas.Common\Atlas.Common.dproj',
            'Packages\Atlas.Windows\Atlas.Windows.dproj', 'Application\AtlasServer.dproj',
            'Application\AtlasUpdate.dproj') + $plugin) {
            $r = pwsh -File $env:ATLAS_DELPHI_BUILD -Project "$env:GITHUB_WORKSPACE\$project" -Platform Win64 -Configuration Release -Mode build -Json | Out-String | ConvertFrom-Json
            $r | ConvertTo-Json -Depth 8 | Write-Host
            if (-not $r.ok) { throw "Build fehlgeschlagen: $project" }
            if ($r.summary.warnings -gt 0 -or $r.summary.hints -gt 0) { throw "Build hat Hinweise oder Warnungen: $project" }
          }
          foreach ($exe in 'Output\Win64\Release\Bin\AtlasServer.exe', 'Output\Win64\Release\Bin\AtlasUpdate.exe') {
            if (-not (Test-Path $exe) -or (Get-Item $exe).LastWriteTime -lt $start) { throw "Release-exe wurde nicht neu geschrieben: $exe" }
          }
      - name: Plugin bauen (Win32 Release)
        shell: pwsh
        run: |
          # Die klassische IDE lädt die Win32-BPL.
          $start = Get-Date
          $r = pwsh -File $env:ATLAS_DELPHI_BUILD -Project "$env:GITHUB_WORKSPACE\Atlas.groupproj" -Platform Win32 -Configuration Release -Mode build -Json | Out-String | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 8 | Write-Host
          # Das Testprojekt der Gruppe gibt es nur für Win64 (DUnitX); nur seine Fehler sind hier erwartet.
          $others = @($r.steps | Where-Object { $_.project -notmatch 'Atlas\.Tests' })
          if (@($others | Where-Object { -not $_.ok }).Count -gt 0) { throw 'Build fehlgeschlagen' }
          if (@($others | Where-Object { $_.summary.warnings -gt 0 -or $_.summary.hints -gt 0 }).Count -gt 0) { throw 'Build hat Hinweise oder Warnungen' }
          # Kern und jedes Modul-Package (#1456): je Package eine neu geschriebene BPL.
          foreach ($package in Get-ChildItem 'Packages' -Directory -Filter 'Atlas.IDE.*' | Where-Object { Test-Path "$($_.FullName)\$($_.Name).dpk" }) {
            $bpl = Get-ChildItem "Output\Win32\Release\Bpl\$($package.Name)*.bpl" -ErrorAction SilentlyContinue |
              Where-Object { $_.BaseName -match ('^' + [regex]::Escape($package.Name) + '\d*$') } | Select-Object -First 1
            if (-not $bpl -or $bpl.LastWriteTime -lt $start) { throw "Win32-BPL von $($package.Name) wurde nicht neu geschrieben" }
          }
      - name: Signieren (optional)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          try {
            # AtlasUpdate.exe zuerst mitsigniert: Signiert prüft sie jedes Update auf denselben Herausgeber (#1519).
            $files = @('Output\Win64\Release\Bin\AtlasServer.exe', 'Output\Win64\Release\Bin\AtlasUpdate.exe') +
              @(Get-ChildItem 'Output\Win32\Release\Bpl\Atlas.IDE.*.bpl', 'Output\Win64\Release\Bpl\Atlas.IDE.*.bpl' -ErrorAction SilentlyContinue | ForEach-Object FullName)
            foreach ($file in $files) {
              signtool sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item $pfx -Force
          }
      - name: Installationspaket packen (#495)
        shell: pwsh
        # Dasselbe Skript nimmt man ohne Delphi-Runner lokal (Publish-ReleasePackage.ps1): Aufbau wie der Zielordner
        # (ADR 0016), Server und Daten oben, Kern und Modul-Packages je Plattform mit Map-Datei darunter.
        run: ./Tools/New-ReleasePackage.ps1 -Version '${{ needs.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            Output/Win64/Release/Bin/AtlasServer.exe
            Output/Win64/Release/Bin/AtlasServer.map
            Output/Win64/Release/Bin/atlas-ide-expert-${{ needs.version.outputs.version }}.zip

  release:
    needs: [version, server]
    # Auch ohne Delphi-Runner: dann enthält das Release nur die Changelog-Notizen.
    if: always() && needs.version.result == 'success' && needs.server.result != 'failure'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.server.result == 'success'
        with:
          name: server
          path: server
      - name: Claude-Code-Plugin mit EXE packen (#101)
        if: needs.server.result == 'success'
        run: |
          mkdir -p plugin && cp -r Editors/ClaudeCode/atlas plugin/atlas
          mkdir -p plugin/atlas/bin && cp server/AtlasServer.exe plugin/atlas/bin/
          # Mitgelieferte EXE statt PATH.
          sed -i 's#"AtlasServer.exe"#"${CLAUDE_PLUGIN_ROOT}/bin/AtlasServer.exe"#' plugin/atlas/.lsp.json plugin/atlas/.mcp.json
          (cd plugin && zip -r "../atlas-claude-plugin-$VERSION.zip" atlas)
      - name: Quelltext packen (#1519)
        run: |
          # Für IDEs ohne fertiges Paket (Delphi 12): AtlasUpdate baut das Plugin daraus. Ohne Präfix, wie der Repo-Stamm.
          git archive --format=zip -o "atlas-ide-expert-source-$VERSION.zip" HEAD
      - name: Versionsdateien für Update-Prüfung und Update-Installer (#495, #1519)
        shell: pwsh
        # Das Plugin liest die stabile über releases/latest/download/atlas-version.json, die mit Vorabversionen über
        # releases/download/update-channel/atlas-version-beta.json. Inhalt: Version, Link zu den Änderungen, Paket
        # je CompilerVersion (37.0 = Delphi 13) und Quelltext, je mit SHA-256. Ohne Delphi-Runner fehlt das Paket;
        # Publish-ReleasePackage.ps1 hängt dann ein lokal gebautes an und schreibt beide Dateien neu.
        run: |
          $package = "server/atlas-ide-expert-$env:VERSION.zip"
          if (-not (Test-Path $package)) { $package = '' }
          ./Tools/New-VersionFile.ps1 -Version $env:VERSION -Repository '${{ github.repository }}' `
            -ServerUrl '${{ github.server_url }}' -SourceZip "atlas-ide-expert-source-$env:VERSION.zip" `
            -PackageZip $package -OutFile atlas-version.json
          Copy-Item atlas-version.json atlas-version-beta.json
      - name: Release-Notizen
        shell: pwsh
        # Kurze Fassung aus docs/Release-Notizen/<Version>.md, sonst der Abschnitt aus CHANGELOG.md.
        run: ./Tools/Get-ReleaseNotes.ps1 -Version $env:VERSION | Set-Content -Encoding utf8 release-notes.md
      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: Atlas ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(env.VERSION, '0.') || contains(env.VERSION, '-') }}
          files: |
            atlas-claude-plugin-${{ env.VERSION }}.zip
            server/AtlasServer.exe
            server/AtlasServer.map
            server/atlas-ide-expert-${{ env.VERSION }}.zip
            atlas-ide-expert-source-${{ env.VERSION }}.zip
            atlas-version.json
          fail_on_unmatched_files: false
      - name: Kanal für Vorabversionen ersetzen (#1519)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fester Vorab-Release: wird nie „latest“, seine Datei zeigt immer auf die neueste Version.
          if ! gh release view update-channel > /dev/null 2>&1; then
            gh release create update-channel --prerelease --title 'Update-Kanal (Vorabversionen)' \
              --notes 'Versionsdatei für updates.channel = prerelease; jeder Release ersetzt sie.'
          fi
          gh release upload update-channel atlas-version-beta.json --clobber
