name: Release

# Veröffentlicht eine Version (#83), ausgelöst durch ein Tag v<SemVer>, z. B. v0.2.0.
#
# 1. Prüft, dass Tag, TProductVersion und Claude-Code-Plugin dieselbe Version tragen.
# 2. Baut den Server (Win64 Release) auf dem selbst gehosteten Delphi-Runner,
#    sofern DELPHI_RUNNER = 'true'; signiert ihn, wenn SIGN_CERT_BASE64 und
#    SIGN_CERT_PASSWORD gesetzt sind.
#    Baut außerdem Plugin (Win32 und Win64) und Installer (#495) und packt sie
#    mit dem Server, whatsnew.json und den Beispielen (#756), tips.json und den
#    Bildern der Tipps (#757), der lokalen HTML-Doku (#766) und den Vorlagen
#    für atlas.json (#759) in atlas-ide-expert-<Version>.zip.
# 3. Packt das Claude-Code-Plugin mit der EXE.
# 4. Legt ein GitHub Release mit EXE, ZIP, Plugin, der Versionsdatei
#    atlas-version.json (Update-Prüfung des Plugins, #495) und dem Abschnitt aus
#    CHANGELOG.md an.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionen vergleichen
        id: check
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./Tools/Check-Version.ps1 -Expected $version
          "version=$version" >> $env:GITHUB_OUTPUT

  server:
    needs: version
    if: vars.DELPHI_RUNNER == 'true'
    runs-on: [self-hosted, windows, delphi]
    env:
      CC_SCRIPT: ${{ vars.CC_SCRIPT || 'C:\Projekte\IDE-Plugins\Claude-Compile\cc.ps1' }}
      HAS_SIGNING: ${{ secrets.SIGN_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # Wie server.yml: RAD Studio Starter hat kein msbuild, gebaut wird über cc.ps1.
      - name: Eigene Scratch-IDE starten
        id: ide
        shell: pwsh
        run: |
          $out = & $env:CC_SCRIPT start -Project "$env:GITHUB_WORKSPACE\Atlas.groupproj" | Out-String
          Write-Host $out
          if ($out -notmatch 'pid\D*(\d+)') { throw 'pid der Scratch-IDE nicht gefunden' }
          "pid=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Server bauen (Win64 Release)
        shell: pwsh
        run: |
          # Projekt für Projekt: Die Gruppe enthält AtlasSetup, das nur Win32 kennt; die IDE stürzt beim
          # Win64-Build daran ab (Zugriffsverletzung in coreide370.bpl).
          $start = Get-Date
          foreach ($project in 'Packages\Atlas.Text\Atlas.Text.dproj', 'Packages\Atlas.Common\Atlas.Common.dproj',
            'Packages\Atlas.Windows\Atlas.Windows.dproj', 'Application\AtlasServer.dproj',
            'Packages\Atlas.IDE.Expert\Atlas.IDE.Expert.dproj') {
            $r = & $env:CC_SCRIPT build -Instance ${{ steps.ide.outputs.pid }} -Project "$env:GITHUB_WORKSPACE\$project" -Platform Win64 -Config Release -Json | Out-String | ConvertFrom-Json
            $r | ConvertTo-Json -Depth 5 | Write-Host
            if (-not $r.ok -or -not $r.outputWritten) { throw "Build fehlgeschlagen oder keine Ausgabe geschrieben: $project" }
            if ($r.logFile -and (Select-String -Path $r.logFile -Pattern '\[dcc.*(Hinweis|Warnung)')) { throw "Build hat Hinweise oder Warnungen: $project" }
          }
          $exe = 'Output\Win64\Release\Bin\AtlasServer.exe'
          if (-not (Test-Path $exe) -or (Get-Item $exe).LastWriteTime -lt $start) { throw 'Release-exe wurde nicht neu geschrieben' }
      - name: Plugin und Installer bauen (Win32 Release)
        shell: pwsh
        run: |
          # Die klassische IDE lädt die Win32-BPL; der Installer läuft als 32-Bit-Programm überall.
          $start = Get-Date
          $r = & $env:CC_SCRIPT group-build -Instance ${{ steps.ide.outputs.pid }} -Platform Win32 -Config Release -Json | Out-String | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 5 | Write-Host
          if (-not $r.ok -or -not $r.outputWritten) { throw 'Build fehlgeschlagen oder keine Ausgabe geschrieben' }
          if ($r.logFile -and (Select-String -Path $r.logFile -Pattern '\[dcc.*(Hinweis|Warnung)')) { throw 'Build hat Hinweise oder Warnungen' }
          $exe = 'Output\Win32\Release\Bin\AtlasSetup.exe'
          if (-not (Test-Path $exe) -or (Get-Item $exe).LastWriteTime -lt $start) { throw 'AtlasSetup.exe wurde nicht neu geschrieben' }
      - name: Scratch-IDE beenden
        if: always() && steps.ide.outputs.pid != ''
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 10; $i++) {
            & $env:CC_SCRIPT quit -Instance ${{ steps.ide.outputs.pid }}
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
      - name: Signieren (optional)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          try {
            $files = @('Output\Win64\Release\Bin\AtlasServer.exe', 'Output\Win32\Release\Bin\AtlasSetup.exe') +
              @(Get-ChildItem 'Output\Win32\Release\Bpl\Atlas.IDE.Expert*.bpl', 'Output\Win64\Release\Bpl\Atlas.IDE.Expert*.bpl' -ErrorAction SilentlyContinue | ForEach-Object FullName)
            foreach ($file in $files) {
              signtool sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item $pfx -Force
          }
      - name: Installationspaket packen (#495)
        shell: pwsh
        run: |
          # Aufbau wie der Zielordner: der Installer nimmt die Dateien aus seinem eigenen Ordner.
          $dist = Join-Path $env:RUNNER_TEMP 'atlas-ide-expert'
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$dist\Win32", "$dist\Win64" | Out-Null
          Copy-Item 'Output\Win64\Release\Bin\AtlasServer.exe', 'Output\Win32\Release\Bin\AtlasSetup.exe', 'LICENSE', 'EULA.txt', 'THIRD-PARTY-NOTICES.md' $dist
          # Karte „Neu in Atlas“ (#756): whatsnew.json aus den markierten Einträgen des Changelogs, dazu die Beispiele.
          ./Tools/Update-WhatsNew.ps1 -OutFile "$dist\whatsnew.json"
          Copy-Item 'Setup\Beispiele' "$dist\Beispiele" -Recurse
          # Karte „Atlas entdecken“ und Tastenkürzel-Tipps (#757): Tippquelle und Bilder; vorher prüfen.
          ./Tools/Check-Tips.ps1
          Copy-Item 'Setup\tips.json' $dist
          Copy-Item 'Setup\Tipps' "$dist\Tipps" -Recurse
          # „Atlas-Doku“ der Willkommensseite (#766): Nutzer-Doku als HTML im Ordner Doku.
          ./Tools/Build-Docs.ps1 -OutDir "$dist\Doku"
          # „Projekt für Atlas einrichten“ (#759): Vorlagen für atlas.json im Ordner Vorlagen.
          Copy-Item 'Setup\Vorlagen' "$dist\Vorlagen" -Recurse
          # Eingebaute Einstellungsprofile (#723), dieselben Dateien wie im Plugin (ProfileData).
          Copy-Item 'Setup\Profile' "$dist\Profile" -Recurse
          Copy-Item 'Output\Win32\Release\Bpl\Atlas.IDE.Expert*.bpl' "$dist\Win32"
          Copy-Item 'Output\Win64\Release\Bpl\Atlas.IDE.Expert*.bpl' "$dist\Win64"
          if (-not (Get-ChildItem "$dist\Win32\*.bpl")) { throw 'Win32-BPL fehlt' }
          # Neben die EXE, damit das Artefakt flach bleibt (gemeinsamer Ordner aller Dateien).
          Compress-Archive -Path "$dist\*" -DestinationPath 'Output\Win64\Release\Bin\atlas-ide-expert-${{ needs.version.outputs.version }}.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            Output/Win64/Release/Bin/AtlasServer.exe
            Output/Win64/Release/Bin/AtlasServer.map
            Output/Win64/Release/Bin/atlas-ide-expert-${{ needs.version.outputs.version }}.zip

  release:
    needs: [version, server]
    # Auch ohne Delphi-Runner: dann enthält das Release nur die Changelog-Notizen.
    if: always() && needs.version.result == 'success' && needs.server.result != 'failure'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.server.result == 'success'
        with:
          name: server
          path: server
      - name: Claude-Code-Plugin mit EXE packen (#101)
        if: needs.server.result == 'success'
        run: |
          mkdir -p plugin && cp -r Editors/ClaudeCode/atlas plugin/atlas
          mkdir -p plugin/atlas/bin && cp server/AtlasServer.exe plugin/atlas/bin/
          # Mitgelieferte EXE statt PATH.
          sed -i 's#"AtlasServer.exe"#"${CLAUDE_PLUGIN_ROOT}/bin/AtlasServer.exe"#' plugin/atlas/.lsp.json plugin/atlas/.mcp.json
          (cd plugin && zip -r "../atlas-claude-plugin-$VERSION.zip" atlas)
      - name: Versionsdatei für die Update-Prüfung (#495)
        run: |
          # Das Plugin liest sie über releases/latest/download/atlas-version.json:
          # nur die Version und der Link zu den Änderungen.
          printf '{"version": "%s", "changes": "%s"}\n' "$VERSION" \
            "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" > atlas-version.json
          cat atlas-version.json
      - name: Changelog-Abschnitt
        shell: pwsh
        run: ./Tools/Get-ChangelogSection.ps1 -Version $env:VERSION | Set-Content -Encoding utf8 release-notes.md
      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: Atlas ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(env.VERSION, '0.') || contains(env.VERSION, '-') }}
          files: |
            atlas-claude-plugin-${{ env.VERSION }}.zip
            server/AtlasServer.exe
            server/AtlasServer.map
            server/atlas-ide-expert-${{ env.VERSION }}.zip
            atlas-version.json
          fail_on_unmatched_files: false
